# HomeBot daemon configuration
# Repository: https://github.com/lama2923/homebot
# Copy to ~/.config/homebot/homebot.toml and edit as needed.
#
# IMPORTANT — AGPLv3 (this project is licensed under the GNU Affero GPL v3):
#   * You MAY add options and change behavior. The project's license grant
#     CANNOT be invalidated, removed, or bypassed by editing this file or
#     by adding a config switch that tries to "turn off" the license.
#   * If you deploy a modified copy as a network service (including this
#     daemon's IPC server), AGPLv3 requires you to provide the full modified
#     source to those users. Do not re-license, watermark, or hide the
#     origin to dodge this - it is a legal requirement, not a suggestion.
#   * Do not change this file in a way that is misleading (e.g. labeling a
#     quiet ignore as "private/secure" when it is not). Be honest about
#     what each switch does.
#
# Regex patterns use double-backslash escaping for TOML strings and are
# case-insensitive. Missing/empty pattern keys are fatal errors.

[general]
locale = "en"
db_path = "~/.local/share/homebot/homebot.db"
socket_path = "~/.local/share/homebot/homebotd.sock"
log_level = "info"

[antiafk]
min_s = 45
max_s = 150

[tpa]
request_ttl_s = 60
max_accepts_per_min = 6
player_cooldown_s = 30
freeze_seconds = 2

# If true, a player who is NOT on the allowlist is actively rejected:
# the bot sends them a direct message telling them their TPA request was
# refused. If false, requests are silently ignored instead.
#
# Honest-note: "silent ignore" is NOT a privacy or security feature. Both
# modes record the attempt in the TPA log, and enabling the reject merely
# makes that fact visible to the requester. Do not ship or describe this
# switch as something it is not.
reject_non_allowlisted = true

# Direct-message template used for the reject above.
# {player} and {message} are substituted at send time.
msg_cmd = "/msg {player} {message}"
not_allowed_message = "Your TPA request was rejected: this bot only accepts its operator's allowlist. Project: https://github.com/lama2923/homebot (AGPLv3)."

# Bare-only race hardening:
# /tpdeny is positional (denies the newest pending) - it only narrows the
# leftover window; post-accept confirmation is the last line of defense.
# Set false if your server has no /tpdeny.
deny_others_on_accept = true
deny_wait_ms = 15000

# Post-accept watch window (ms). If a confirm line names a player other
# than the expected one, a 'teleport_mismatch' alarm fires (base-leak
# evidence).
confirm_window_ms = 20000

# Command templates - server-dependent, fully configurable.
accept_cmd = "/tpaccept {player}"
deny_cmd = "/tpdeny"
request_cmd = "/tpa {player}"

[tpaguard]
allow_tpahere_from = []

# Auth profile - all regex patterns are defined here, never in code.
# Add patterns for your server's language(s); combine multiple
# languages in one profile.
[auth_profiles.default]
register_prompt = ["please,?\\s*register", "/register"]
login_prompt = ["please,?\\s*(log\\s*in)", "/login"]
wrong_password = ["wrong\\s*password"]
already_logged = ["already\\s*logged\\s*in", "successful\\s*log\\s*in"]
already_registered = ["already registered|already been registered|this username is already"]
register_cmd = "/register {p} {p}"
login_cmd = "/login {p}"
tpa_request = ["([A-Za-z0-9_]{3,16}).*requested.*teleport.*to.*you", "([A-Za-z0-9_]{3,16}).*wants.*to.*teleport.*to.*you"]
tpahere_request = ["([A-Za-z0-9_]{3,16}).*requested.*that.*you.*teleport.*to.*them", "([A-Za-z0-9_]{3,16}).*wants.*you.*to.*teleport.*to.*them"]
respawn_set = ["respawn\\s*point\\s*set"]
tpa_confirm = ["([A-Za-z0-9_]{3,16}).*teleport.*(started|successful)"]
tpa_deny = ["request.*denied|tpa.*cancelled|cancelled"]
tpa_expired = ["request.*expired|timed\\s*out"]
tp_success = ["teleport"]
bed_missing = ["bed.*obstruct|bed.*missing|this bed is no longer|your bed is (missing|gone|destroyed)"]
kick_banned = ["banned"]
